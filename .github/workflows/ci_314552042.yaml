name: CI

on:
  push:

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Init summary
        run: |
          echo "## CI Check Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY

      - name: TypeScript typecheck
        run: |
          if npm run typecheck; then
            echo "| TypeScript Typecheck | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| TypeScript Typecheck | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Prettier check
        run: |
          if npm run format:check; then
            echo "| Prettier Check | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Prettier Check | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run tests
        run: npm run test -- --reporter=verbose --reporter=junit --outputFile=test-results.xml

      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'test-results.xml'